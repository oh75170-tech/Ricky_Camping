name: Build Android app (APK, test)

on:
  push:
    branches: [main, claude/camping-layout-simulator-k1hxhv]
    paths: ['app/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install & build web app
        run: |
          npm ci
          npm run build
        env:
          VITE_API_BASE: ${{ vars.API_BASE }}
      - name: Build APK (fixed signing key, verified)
        run: bash scripts/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CampCanvas-apk
          path: app/CampCanvas.apk
