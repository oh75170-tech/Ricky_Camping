name: Deploy server to Cloudflare Workers

# 필요한 저장소 Secrets (Settings → Secrets and variables → Actions → New repository secret)
#   CLOUDFLARE_API_TOKEN   Cloudflare API 토큰 ("Edit Cloudflare Workers" 템플릿)
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare 계정 ID
#   ANTHROPIC_API_KEY      Anthropic API 키 (AI 기능용)
#   APP_PASSCODE           앱 설정에 입력할 AI 접속 코드 (직접 정한 문자열)
#   SEARCH_CODE            (선택) AI 검색 전용 코드 – 없으면 AI 검색이 꺼짐
#   ADMIN_CODE             (선택) 앱에서 '장비목록 공유'를 올릴 때 쓰는 관리자 코드 (직접 정한 문자열)
#   GOCAMPING_KEY          (선택) 공공데이터포털 고캠핑 서비스 키 – 없으면 캠핑장 검색은 OpenStreetMap 사용
on:
  workflow_dispatch:
  push:
    branches: [main, claude/camping-layout-simulator-k1hxhv]
    paths: ['server/**', '.github/workflows/deploy-server.yml']

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check secrets
        id: check
        working-directory: .
        run: |
          missing=""
          [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ] && missing="$missing ANTHROPIC_API_KEY"
          [ -z "${{ secrets.APP_PASSCODE }}" ] && missing="$missing APP_PASSCODE"
          if [ -n "$missing" ]; then
            echo "::warning::저장소 Secrets가 아직 없어 배포를 건너뜁니다:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
      - name: Install & typecheck
        if: steps.check.outputs.ready == 'true'
        run: |
          npm ci
          npx tsc --noEmit
      - name: Deploy worker
        if: steps.check.outputs.ready == 'true'
        run: npx wrangler deploy 2>&1 | tee deploy.log
      - name: Set worker secrets
        if: steps.check.outputs.ready == 'true'
        run: |
          printf '%s' "${{ secrets.ANTHROPIC_API_KEY }}" | npx wrangler secret put ANTHROPIC_API_KEY
          printf '%s' "${{ secrets.APP_PASSCODE }}" | npx wrangler secret put APP_PASSCODE
          if [ -n "${{ secrets.SEARCH_CODE }}" ]; then
            printf '%s' "${{ secrets.SEARCH_CODE }}" | npx wrangler secret put SEARCH_CODE
          else
            echo "::warning::SEARCH_CODE가 없어 AI 검색은 꺼진 상태로 배포됩니다."
          fi
          if [ -n "${{ secrets.ADMIN_CODE }}" ]; then
            printf '%s' "${{ secrets.ADMIN_CODE }}" | npx wrangler secret put ADMIN_CODE
          else
            echo "::notice::ADMIN_CODE가 없어 장비목록 공유 올리기는 꺼진 상태입니다."
          fi
          if [ -n "${{ secrets.GOCAMPING_KEY }}" ]; then
            printf '%s' "${{ secrets.GOCAMPING_KEY }}" | npx wrangler secret put GOCAMPING_KEY
          else
            echo "::notice::GOCAMPING_KEY가 없어 캠핑장 검색은 OpenStreetMap으로 동작합니다."
          fi
      - name: Health check
        if: steps.check.outputs.ready == 'true'
        run: |
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "SERVER_URL=$URL"
          echo "### 서버 주소: $URL" >> "$GITHUB_STEP_SUMMARY"
          sleep 5
          curl -sS "$URL/health" | tee -a "$GITHUB_STEP_SUMMARY"
